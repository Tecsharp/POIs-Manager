spring.application.name=pois-backend
server.port=${SERVER_PORT:8082}

# Configuracion PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.stringtype=unspecified

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Secret
pois.back.jwt.secret=${JWT_SECRET}
pois.back.jwt.expiration=86400000
pois.back.jwt.remember-me-expiration=2592000000

# Administrador inicial (lo genera setup.sh)
pois.admin.email=${ADMIN_EMAIL:}
pois.admin.password=${ADMIN_PASSWORD:}
pois.seed.enabled=${SEED_POIS:true}

# Cuotas
pois.anonymous.requests-per-minute=${ANON_REQUESTS_PER_MINUTE:60}
pois.api-key.daily-limit=${API_KEY_DAILY_LIMIT:1000}
pois.api-key.max-per-user=${API_KEY_MAX_PER_USER:3}

# Ruteo por carretera (OSRM). Por defecto usa el servidor demo público (sin SLA);
# para producción real, apuntar a un OSRM propio vía OSRM_URL.
pois.routing.enabled=${ROUTING_ENABLED:true}
pois.routing.osrm-url=${OSRM_URL:https://router.project-osrm.org}
pois.routing.timeout-ms=${ROUTING_TIMEOUT_MS:4000}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.jpa.open-in-view=false
spring.mvc.servlet.load-on-startup=1
